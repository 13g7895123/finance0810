name: Finance CICD

on:
  push:
    branches: [ master, develop ]

jobs:
  deploy:
    name: 部署應用程式
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
    
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 8022 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -p 8022 -i ~/.ssh/id_ed25519 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e  # 在任何命令失敗時立即退出
            
            echo "開始部署程序..."
            echo "當前分支: ${GITHUB_REF##*/}"

            if [[ "${GITHUB_REF##*/}" == "master" ]]; then
              DEPLOY_PATH="~/project/bonus/finance0810"
            elif [[ "${GITHUB_REF##*/}" == "develop" ]]; then
              DEPLOY_PATH="~/project/bonus/develop/finance0810_D"
            else
              echo "No deploy path set for this branch"
              exit 1
            fi

            echo "切換到部署目錄: $DEPLOY_PATH"
            cd $DEPLOY_PATH || { echo "無法切換到部署目錄"; exit 1; }
            
            # 備份當前的 .env 檔案
            if [ -f .env ]; then
              cp .env .env.backup
              echo "已備份 .env 檔案"
            fi
            
            # 拉取最新程式碼
            echo "拉取最新程式碼..."
            git pull || { echo "Git pull 失敗"; exit 1; }
            
            # 如果 .env 被覆蓋，則恢復備份
            if [ -f .env.backup ]; then
              cp .env.backup .env
              rm .env.backup
              echo "已恢復 .env 檔案"
            fi
            
            # 檢查後端容器是否正在運行
            if [ "$(docker compose ps -q backend)" ]; then
              echo "後端容器已在運行，跳過重啟"
              BACKEND_RUNNING=true
            else
              echo "後端容器未運行，將會啟動"
              BACKEND_RUNNING=false
            fi
            
            # 僅重新建構並啟動前端服務
            docker compose up -d --build frontend
            
            # 如果後端未運行，則啟動後端（不重新建構）
            if [ "$BACKEND_RUNNING" = "false" ]; then
              docker compose up -d backend mysql redis phpmyadmin
              echo "等待後端服務啟動完成..."
              sleep 30
              
              # 執行資料庫遷移（僅在後端重新啟動時）
              docker compose exec -T backend php artisan migrate --force
              
              # 執行資料庫填充（如果需要）
              docker compose exec -T backend php artisan db:seed --force --class=RolesAndPermissionsSeeder
            fi
            
            # 檢查容器狀態
            docker compose ps
            
            # 清除快取（每次部署都執行）
            docker compose exec -T backend php artisan config:cache
            docker compose exec -T backend php artisan route:cache
            docker compose exec -T backend php artisan view:cache
            
            echo "部署完成！前端已重新建構，後端保持運行狀態"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519