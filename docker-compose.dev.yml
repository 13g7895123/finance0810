services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    networks:
      - crm-network
      - npm_network
    depends_on:
      - backend
    
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/storage
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_NAME=Finance CRM
      - APP_KEY=${APP_KEY}
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=finance_crm
      - DB_USERNAME=finance_user
      - DB_PASSWORD=finance_pass_2024
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_pass_2024
      - JWT_SECRET=${JWT_SECRET}
      - BROADCAST_DRIVER=null
    networks:
      - crm-network
      - npm_network
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_2024
      - MYSQL_DATABASE=finance_crm
      - MYSQL_USER=finance_user
      - MYSQL_PASSWORD=finance_pass_2024
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - crm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --requirepass redis_pass_2024
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=finance_user
      - PMA_PASSWORD=finance_pass_2024
      - MYSQL_ROOT_PASSWORD=root_password_2024
    depends_on:
      - mysql
    networks:
      - crm-network
      - npm_network
    restart: unless-stopped

networks:
  crm-network:
    driver: bridge
  npm_network:
    external: true

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  backend_bootstrap_cache:
    driver: local